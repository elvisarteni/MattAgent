[project]
name = "vero-status"
version = "4.3.0"
description = "Dashboard: is Vero available, and which model does it use? (ASPF-1578)"
requires-python = ">=3.8"
dependencies = []

[tool.ruff]
line-length = 130
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607", "S310", "UP006", "UP007", "UP035", "UP045", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
"scripts/**" = ["S311"]  # demo randomness, not security

[tool.mypy]
python_version = "3.9"
files = ["vero_status"]
strict = true
